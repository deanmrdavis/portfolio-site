[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Old Squarespace URL for the certifications page
[[redirects]]
  from = "/projects-1"
  to = "/certifications"
  status = 301

# Squarespace cart page no longer exists
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
